name: Bug report
description: Report one reproducible Maestrly App defect
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Use an isolated profile and synthetic repository whenever possible. Do not include credentials, private conversations, repositories, paths, or raw logs.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the exact app version or full commit SHA.
      placeholder: 0.1.0 or a full commit SHA
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: architecture
    attributes:
      label: Architecture and OS version
      placeholder: arm64, macOS 15.6
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation mode
      options:
        - Source checkout
        - Local validation package
        - GitHub Actions validation package
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the observable result you expected.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe the observable result, including sanitized error text only.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic example using synthetic data.
      placeholder: |
        1. Start with an empty isolated development profile.
        2. Create a synthetic Git repository.
        3. ...
    validations:
      required: true

  - type: textarea
    id: restart-regression
    attributes:
      label: Restart and regression details
      description: State whether restart changes the result and the last version/commit known to work.

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Remove tokens, URLs with credentials, private paths, names, conversations, and repository content. Attach no database or raw log.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, personal data, private content, and identifying paths from this report and its attachments.
          required: true
